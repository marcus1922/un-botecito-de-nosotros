<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Un botecito para ti</title>
  <style>
    :root{--night:#101126;--night2:#1a1b2f;--sky:#d4f0ff;--pink:#ffd1dc;--gold:#ffe2a6;--ink:#34304f;--paper:#fffaf8}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}
    body{font-family:"Trebuchet MS",Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 36%,#3f416f 0,#25264d 26%,#15162f 58%,#090a1b 100%);min-height:100vh}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 24%,rgba(255,209,220,.11),transparent 24%),radial-gradient(circle at 81% 34%,rgba(189,229,255,.12),transparent 26%);mix-blend-mode:screen}
    button{font:inherit}.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}
    .star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.45;animation:twinkle 3s infinite alternate;box-shadow:0 0 8px #fff}
    .star:nth-child(3n){width:5px;height:5px;background:var(--gold)}
    @keyframes twinkle{to{opacity:1;transform:scale(1.5)}}
    .cloud{position:absolute;width:210px;height:55px;border-radius:100px;background:rgba(212,240,255,.09);filter:blur(1px);animation:drift 30s linear infinite}
    .cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:90px;height:90px;left:35px;bottom:0}.cloud:after{width:120px;height:110px;right:20px;bottom:0}
    .cloud.c1{top:19%;left:-220px}.cloud.c2{top:73%;left:-300px;animation-delay:-15s;transform:scale(.7)}
    @keyframes drift{to{left:110vw}}
    header{position:relative;z-index:3;text-align:center;padding:34px 20px 0}
    .eyebrow{font:italic 18px Georgia,serif;color:var(--pink);margin:0 0 6px}.title{font:400 clamp(38px,6vw,72px) Georgia,serif;margin:0;letter-spacing:-.035em;text-shadow:0 0 28px rgba(255,209,220,.25)}
    .subtitle{margin:9px auto 0;color:#d9daef;max-width:580px;font:16px/1.5 Georgia,serif}
    .scene{position:relative;z-index:2;min-height:690px;display:grid;place-items:center;padding:15px 20px 100px;isolation:isolate}
    .moon-halo{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(211,241,255,.18),rgba(173,204,255,.05) 48%,transparent 68%);filter:blur(3px);z-index:-1}
    .jar-button{position:relative;width:380px;height:500px;border:0;background:none;cursor:pointer;outline:none;filter:drop-shadow(0 38px 30px rgba(0,0,0,.46));transition:transform .65s cubic-bezier(.2,.8,.2,1)}
    .jar-button:hover{transform:translateY(-7px)}.jar-button:focus-visible{outline:3px solid var(--pink);outline-offset:12px;border-radius:44%}
    .jar{position:absolute;left:36px;top:106px;width:308px;height:354px;clip-path:path('M 78 4 C 62 4 55 12 52 29 L 48 50 C 18 67 5 90 5 125 L 5 285 C 5 327 31 349 75 349 L 233 349 C 277 349 303 327 303 285 L 303 125 C 303 90 290 67 260 50 L 256 29 C 253 12 246 4 230 4 Z');background:linear-gradient(105deg,rgba(255,255,255,.19),rgba(215,244,255,.035) 25%,rgba(160,198,234,.08) 61%,rgba(255,255,255,.16));box-shadow:inset 20px 0 28px rgba(255,255,255,.10),inset -18px -22px 35px rgba(119,157,218,.13),0 0 55px rgba(194,234,255,.2);overflow:hidden}
    .jar-outline{position:absolute;left:36px;top:106px;width:308px;height:354px;z-index:6;pointer-events:none;filter:drop-shadow(0 0 8px rgba(217,246,255,.25))}.jar-outline svg{width:100%;height:100%;overflow:visible}.jar-outline path{fill:none;stroke:rgba(221,246,255,.83);stroke-width:4;vector-effect:non-scaling-stroke}.jar-outline .inner{stroke:rgba(255,255,255,.22);stroke-width:1.4}
    .jar:before{content:"";position:absolute;z-index:5;left:38px;top:66px;width:31px;height:218px;border-radius:50%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.66) 18%,rgba(255,255,255,.06) 78%,transparent);transform:rotate(5deg)}
    .jar:after{content:"";position:absolute;z-index:5;right:28px;top:102px;width:12px;height:172px;border-radius:50%;background:linear-gradient(transparent,rgba(220,246,255,.32),transparent)}
    .jar-glow{position:absolute;left:83px;top:178px;width:215px;height:215px;border-radius:50%;background:#bfeaff25;filter:blur(28px)}
    .cinnamoroll-img{position:absolute;z-index:2;left:24px;top:67px;width:264px;height:auto;object-fit:contain;filter:drop-shadow(0 12px 15px rgba(85,150,214,.28)) drop-shadow(0 0 16px rgba(255,255,255,.45));animation:floatCharacter 4.8s ease-in-out infinite}@keyframes floatCharacter{50%{transform:translateY(-9px) rotate(1.5deg)}}
    .jar-floor{position:absolute;z-index:3;left:35px;right:35px;bottom:20px;height:24px;border-radius:50%;background:radial-gradient(ellipse,#9fdcff46 0,transparent 70%);filter:blur(3px)}
    .rim{position:absolute;z-index:7;top:91px;left:95px;width:190px;height:50px;border:4px solid rgba(221,246,255,.88);border-radius:20px 20px 48% 48%;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(169,220,246,.05));box-shadow:inset 0 -12px 15px #8dc9e728,0 5px 12px #0b0c1f55}.rim:after{content:"";position:absolute;left:10px;right:10px;bottom:8px;height:7px;border-radius:50%;border-bottom:2px solid rgba(255,255,255,.48)}
    .cork{position:absolute;z-index:8;top:50px;left:112px;width:156px;height:70px;border-radius:13px 13px 20px 20px;background:linear-gradient(90deg,#a8734c,#d39a68 20%,#e8bb83 55%,#bd8358);border:3px solid #93623f;box-shadow:inset 0 5px 5px #ffe3b863,0 12px 16px #08091d66;transform-origin:center;transition:1s cubic-bezier(.18,.89,.32,1.28)}.cork:before{content:"";position:absolute;inset:8px 11px;border-radius:8px;background-image:radial-gradient(#8b5c42 1px,transparent 1.5px);background-size:13px 12px;opacity:.35}
    .ribbon{position:absolute;z-index:9;top:94px;left:83px;width:214px;height:62px;filter:drop-shadow(0 8px 7px rgba(9,10,31,.34));transform-origin:50% 18px;transition:.72s cubic-bezier(.22,.8,.3,1)}
    .ribbon-band{position:absolute;left:9px;right:9px;top:10px;height:21px;border-radius:7px;background:linear-gradient(180deg,#ffd4df 0,#f4aabd 48%,#d77f9a 100%);box-shadow:inset 0 3px 3px #fff7,inset 0 -3px 3px #a8517044}
    .bow-knot{position:absolute;z-index:4;left:88px;top:2px;width:39px;height:34px;border-radius:48% 52% 45% 48%;background:radial-gradient(circle at 35% 28%,#ffe3ea,#f1a1b6 58%,#cf718e);box-shadow:inset 3px 2px 4px #fff8,0 4px 6px #82465d4d}
    .bow-loop{position:absolute;z-index:3;top:-4px;width:79px;height:48px;background:linear-gradient(140deg,#ffdce5,#eda0b5 62%,#ca6f8c);box-shadow:inset 5px 5px 8px #fff6,inset -5px -4px 7px #9b4e6744}.bow-loop:after{content:"";position:absolute;inset:10px 13px;border-radius:50%;background:#a9587254;box-shadow:inset 0 2px 5px #7040524d}.bow-loop.left{left:28px;border-radius:65% 35% 42% 58%;transform:rotate(-12deg)}.bow-loop.right{right:27px;border-radius:35% 65% 58% 42%;transform:rotate(12deg)}
    .bow-tail{position:absolute;z-index:2;top:26px;width:46px;height:62px;background:linear-gradient(110deg,#f6b4c5,#d97896);clip-path:polygon(8% 0,100% 0,77% 100%,47% 77%,14% 100%)}.bow-tail.left{left:62px;transform:rotate(10deg)}.bow-tail.right{right:62px;transform:scaleX(-1) rotate(10deg)}
    .tag{position:absolute;z-index:7;right:7px;top:172px;width:82px;height:54px;padding-top:18px;border-radius:8px 8px 14px 14px;background:#fff8e8;color:#7d5873;font:italic 11px Georgia,serif;text-align:center;box-shadow:0 8px 18px #0004;transform:rotate(8deg)}.tag:before{content:"";position:absolute;left:41px;bottom:49px;width:1px;height:63px;background:#e9bfca;transform:rotate(-12deg);transform-origin:bottom}.tag:after{content:"♡";position:absolute;left:32px;top:3px;color:#ebaabd;font-size:14px}
    .note-roll{position:absolute;z-index:4;width:47px;height:14px;border-radius:8px;background:linear-gradient(90deg,#e9c983,#fff9df 25%,#fff0c2 78%,#d9b86f);box-shadow:inset 0 2px 2px #fff9,0 0 11px #fff8;transform:rotate(var(--r))}.note-roll:before,.note-roll:after{content:"";position:absolute;top:-2px;width:6px;height:18px;border-radius:50%;background:#e4c47f}.note-roll:before{left:-2px}.note-roll:after{right:-2px}.n1{left:29px;top:289px;--r:16deg}.n2{right:23px;top:282px;--r:-17deg}.n3{left:108px;top:310px;--r:7deg}.n4{right:54px;top:324px;--r:20deg}
    .flight-layer{position:absolute;z-index:12;inset:0;pointer-events:none}.paper-flight{position:absolute;left:50%;top:355px;width:52px;height:34px;opacity:0;transform:translate(-50%,0) rotate(var(--start-r));filter:drop-shadow(0 5px 7px rgba(0,0,0,.28))}.f-scroll{position:absolute;left:4px;top:10px;width:44px;height:13px;border-radius:8px;background:linear-gradient(90deg,#d9b668,#fff8dc 28%,#f9e6ae 73%,#caa253);box-shadow:0 0 10px #fff8}.f-scroll:before,.f-scroll:after{content:"";position:absolute;top:-2px;width:6px;height:17px;border-radius:50%;background:#d6b46c}.f-scroll:before{left:-2px}.f-scroll:after{right:-2px}
    .creature{position:absolute;inset:0;opacity:0}.butterfly:before,.butterfly:after{content:"";position:absolute;top:3px;width:27px;height:29px;background:linear-gradient(145deg,#fffdf1,#ffd2df 67%,#e8a9c7);border:1px solid #fff9}.butterfly:before{left:0;border-radius:85% 28% 70% 30%;transform-origin:100% 70%}.butterfly:after{right:0;border-radius:28% 85% 30% 70%;transform-origin:0 70%}.butterfly i{position:absolute;z-index:2;left:24px;top:10px;width:5px;height:22px;border-radius:50%;background:#d690aa}.bird svg{width:56px;height:35px;overflow:visible}.bird path{fill:#fffdf2;stroke:#d4eafb;stroke-width:1.4}.bird .wing{transform-origin:center;animation:wingbeat .34s ease-in-out infinite alternate}@keyframes wingbeat{to{transform:scaleY(.4) translateY(7px)}}
    body.open .paper-flight{animation:paperFlight 2.25s var(--fd) cubic-bezier(.2,.65,.35,1) forwards}body.open .paper-flight .f-scroll{animation:scrollMorph 2.25s var(--fd) linear forwards}body.open .paper-flight .creature{animation:creatureReveal 2.25s var(--fd) linear forwards}body.open .paper-flight .butterfly:before{animation:leftWing .32s calc(var(--fd) + .8s) ease-in-out infinite alternate}body.open .paper-flight .butterfly:after{animation:rightWing .32s calc(var(--fd) + .8s) ease-in-out infinite alternate}
    @keyframes paperFlight{0%{opacity:0;transform:translate(-50%,0) rotate(var(--start-r)) scale(.75)}9%{opacity:1}34%{transform:translate(calc(-50% + var(--x1)),var(--y1)) rotate(15deg) scale(.9)}66%{opacity:1;transform:translate(calc(-50% + var(--x2)),var(--y2)) rotate(-9deg) scale(1.15)}100%{opacity:0;transform:translate(calc(-50% + var(--x3)),var(--y3)) rotate(12deg) scale(.65)}}@keyframes scrollMorph{0%,30%{opacity:1;transform:scale(1)}39%,100%{opacity:0;transform:scale(.2) rotate(80deg)}}@keyframes creatureReveal{0%,32%{opacity:0;transform:scale(.2)}43%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.7)}}@keyframes leftWing{to{transform:rotateY(55deg) rotate(-8deg)}}@keyframes rightWing{to{transform:rotateY(-55deg) rotate(8deg)}}
    .instruction{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff;font-size:14px;letter-spacing:.04em}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pink);margin-right:8px;box-shadow:0 0 0 0 #ffd1dc80;animation:pulse 1.8s infinite}@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}}
    .magic{position:absolute;inset:60px 20px 0;pointer-events:none}.spark{position:absolute;left:50%;top:40%;opacity:0;font-size:22px;color:var(--gold)}
    body.open .cork{transform:translate(88px,-145px) rotate(34deg)}body.open .ribbon{opacity:0;transform:translateY(-22px) scale(.84) rotate(-8deg)}body.open .jar-button{transform:scale(1.06)}body.open .instruction{opacity:0}.jar .note-roll{transition:.25s}.open .jar .note-roll{opacity:0;transform:translateY(-25px) scale(.6)}
    body.open .spark{animation:burst 1.6s var(--d) ease-out forwards}@keyframes burst{15%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(190deg) scale(.3)}}
    .messages{position:absolute;inset:0;pointer-events:none}.message-pill{position:absolute;left:50%;top:47%;width:210px;min-height:94px;padding:20px 22px;border:0;border-radius:9px 23px 9px 23px;background:linear-gradient(135deg,#fff8 0 9%,transparent 10%),var(--c);color:var(--ink);font:700 18px/1.2 Georgia,serif;box-shadow:0 18px 35px #0005,0 0 0 3px #ffffff70 inset;opacity:0;clip-path:polygon(16% 42%,84% 42%,80% 58%,20% 58%);transform:translate(-50%,-50%) scale(.32) rotate(25deg);pointer-events:none;cursor:pointer;transition:filter .25s,box-shadow .25s}.message-pill:before{content:"";position:absolute;inset:7px;border:1px solid #fff9;border-radius:6px 17px 6px 17px;pointer-events:none}
    .message-pill:hover{filter:brightness(1.05);box-shadow:0 23px 42px #0006,0 0 0 3px #fff9 inset}.message-pill:focus-visible{outline:3px solid #fff;outline-offset:5px}.message-pill small{display:block;font:13px/1.3 Arial,sans-serif;margin-top:8px;opacity:.68}
    body.open .message-pill{pointer-events:auto;animation:unfoldMessage .82s calc(1.75s + var(--delay)) cubic-bezier(.18,.85,.28,1.2) forwards}@keyframes unfoldMessage{0%{opacity:0;clip-path:polygon(16% 42%,84% 42%,80% 58%,20% 58%);transform:translate(-50%,-50%) scale(.32) rotate(25deg)}55%{opacity:1;clip-path:polygon(5% 9%,95% 9%,90% 91%,10% 91%)}100%{opacity:1;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r))}}
    .modal{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:20px;background:rgba(8,8,24,.72);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:.35s}.modal.visible{opacity:1;visibility:visible}
    .letter{position:relative;width:min(620px,94vw);max-height:86vh;overflow:auto;background:linear-gradient(90deg,transparent 35px,#f2bfc8 36px,#f2bfc8 37px,transparent 38px),repeating-linear-gradient(#fffdf9 0 31px,#dce7f3 32px);color:var(--ink);padding:58px clamp(30px,8vw,80px);border-radius:5px 22px 5px 22px;box-shadow:0 28px 80px #0008;transform:rotateX(18deg) scale(.82);transition:.55s cubic-bezier(.2,.8,.2,1)}.modal.visible .letter{transform:none}
    .letter h2{font:400 clamp(28px,6vw,44px) Georgia,serif;margin:0 0 23px;color:#65528b}.letter p{font:17px/1.9 Georgia,serif;margin:0 0 18px}.letter .quote{border-left:4px solid #f1abbc;padding-left:18px;font-style:italic}.close{position:absolute;right:16px;top:15px;width:38px;height:38px;border:0;border-radius:50%;background:#ebe5f5;color:#51466b;font-size:22px;cursor:pointer}.breath{border:0;border-radius:40px;background:#cdeafa;color:#33546b;padding:12px 20px;cursor:pointer;font-weight:bold}.breath-orb{display:none;width:90px;height:90px;margin:25px auto 0;border-radius:50%;background:#d4f0ff;box-shadow:0 0 35px #8fe1ff}.breath-orb.go{display:block;animation:breathe 8s ease-in-out 2}@keyframes breathe{0%,100%{transform:scale(.55);opacity:.55}50%{transform:scale(1);opacity:1}}
    .qualities{display:flex;flex-wrap:wrap;gap:9px}.qualities span{opacity:0;background:#ffedb5;padding:7px 12px;border-radius:20px;transform:translateY(8px)}.modal.visible .qualities span{animation:write .4s forwards;animation-delay:calc(var(--i)*.3s)}@keyframes write{to{opacity:1;transform:none}}
    .player{position:fixed;z-index:10;right:18px;bottom:18px;display:flex;align-items:center;gap:10px;background:#f7f5ffeb;color:var(--ink);padding:9px 14px 9px 9px;border-radius:40px;box-shadow:0 10px 30px #0005}.play{width:39px;height:39px;border:0;border-radius:50%;background:#d79bb5;color:white;cursor:pointer}.song{font-size:12px;line-height:1.25}.song b{display:block}.visualizer{display:flex;gap:2px;height:17px;align-items:end}.visualizer i{display:block;width:2px;height:30%;background:#98789d}.player.playing i{animation:bars .8s infinite alternate}.player.playing i:nth-child(2){animation-delay:.2s}.player.playing i:nth-child(3){animation-delay:.4s}@keyframes bars{to{height:100%}}
    .trail{position:fixed;z-index:99;pointer-events:none;color:#ffd5e1;animation:trail .75s forwards}@keyframes trail{to{transform:translateY(18px) scale(0);opacity:0}}
    @media(max-width:700px){header{padding-top:24px}.subtitle{font-size:14px}.scene{min-height:740px;align-items:start;padding-top:28px}.moon-halo{width:390px;height:390px}.jar-button{transform:scale(.78)}.jar-button:hover{transform:scale(.80)}body.open .jar-button{transform:scale(.82)}body.open .message-pill{--x:var(--mx);--y:var(--my)}.player{right:10px;bottom:10px}.message-pill{width:128px;min-height:74px;padding:14px 12px;font-size:13px}.message-pill small{font-size:10px;margin-top:5px}.paper-flight{top:325px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.cloud{display:none}}
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="cloud c1"></div><div class="cloud c2"></div>
  </div>
  <header><p class="eyebrow">Abrí el cielo y guardé un pedacito para ti</p><h1 class="title">Un botecito de nosotros</h1><p class="subtitle">Aquí viven palabras para los días bonitos, los complicados y todos los que todavía nos faltan.</p></header>
  <main class="scene">
    <div class="moon-halo" aria-hidden="true"></div>
    <button class="jar-button" id="jar" aria-label="Abrir el bote mágico" aria-expanded="false">
      <span class="cork"></span>
      <span class="ribbon" aria-hidden="true"><i class="ribbon-band"></i><i class="bow-loop left"></i><i class="bow-loop right"></i><i class="bow-tail left"></i><i class="bow-tail right"></i><i class="bow-knot"></i></span>
      <span class="rim"></span>
      <span class="jar-glow"></span>
      <span class="jar"><img class="cinnamoroll-img" src="assets/cinnamoroll-transparent.png" alt="Cinnamoroll abrazando un corazón rosa"><i class="jar-floor"></i><i class="note-roll n1"></i><i class="note-roll n2"></i><i class="note-roll n3"></i><i class="note-roll n4"></i></span>
      <span class="jar-outline" aria-hidden="true"><svg viewBox="0 0 308 354"><path d="M78 4C62 4 55 12 52 29L48 50C18 67 5 90 5 125V285C5 327 31 349 75 349H233C277 349 303 327 303 285V125C303 90 290 67 260 50L256 29C253 12 246 4 230 4Z"/><path class="inner" d="M57 57C31 73 20 94 20 126V280C20 315 42 332 78 332H230C266 332 288 315 288 280V126C288 94 277 73 251 57"/></svg></span>
      <span class="tag">para ti</span>
      <span class="instruction"><i class="pulse"></i>Toca el frasco para abrirlo</span>
      <span class="magic" aria-hidden="true"></span>
      <span class="flight-layer" aria-hidden="true">
        <i class="paper-flight" style="--fd:.18s;--start-r:-12deg;--x1:-38px;--y1:-82px;--x2:-125px;--y2:-155px;--x3:-245px;--y3:-230px"><b class="f-scroll"></b><b class="creature butterfly"><i></i></b></i>
        <i class="paper-flight" style="--fd:.32s;--start-r:15deg;--x1:46px;--y1:-76px;--x2:132px;--y2:-150px;--x3:255px;--y3:-215px"><b class="f-scroll"></b><b class="creature bird"><svg viewBox="0 0 60 36"><path class="wing" d="M29 18C20 3 9 1 2 7c9 1 13 10 20 16Z"/><path class="wing" d="M30 18C40 3 51 2 58 8c-10 1-14 9-21 15Z"/><path d="M21 19c5-6 13-6 18 0-5 7-13 8-18 0Z"/></svg></b></i>
        <i class="paper-flight" style="--fd:.46s;--start-r:5deg;--x1:-18px;--y1:-95px;--x2:-62px;--y2:-210px;--x3:-125px;--y3:-305px"><b class="f-scroll"></b><b class="creature bird"><svg viewBox="0 0 60 36"><path class="wing" d="M29 18C20 3 9 1 2 7c9 1 13 10 20 16Z"/><path class="wing" d="M30 18C40 3 51 2 58 8c-10 1-14 9-21 15Z"/><path d="M21 19c5-6 13-6 18 0-5 7-13 8-18 0Z"/></svg></b></i>
        <i class="paper-flight" style="--fd:.57s;--start-r:-18deg;--x1:34px;--y1:-88px;--x2:83px;--y2:-215px;--x3:145px;--y3:-305px"><b class="f-scroll"></b><b class="creature butterfly"><i></i></b></i>
        <i class="paper-flight" style="--fd:.68s;--start-r:8deg;--x1:5px;--y1:-105px;--x2:12px;--y2:-235px;--x3:30px;--y3:-355px"><b class="f-scroll"></b><b class="creature bird"><svg viewBox="0 0 60 36"><path class="wing" d="M29 18C20 3 9 1 2 7c9 1 13 10 20 16Z"/><path class="wing" d="M30 18C40 3 51 2 58 8c-10 1-14 9-21 15Z"/><path d="M21 19c5-6 13-6 18 0-5 7-13 8-18 0Z"/></svg></b></i>
      </span>
    </button>
    <nav class="messages" aria-label="Cartitas para abrir">
      <button class="message-pill" data-key="relacion" style="--c:#ffd1dc;--x:-370px;--y:-92px;--mx:-115px;--my:-180px;--r:-5deg;--delay:.05s">Nuestra relación<small>para recordar lo nuestro</small></button>
      <button class="message-pill" data-key="enojo" style="--c:#d4f0ff;--x:360px;--y:-108px;--mx:110px;--my:-190px;--r:4deg;--delay:.14s">Enojo e ira<small>un respiro contigo</small></button>
      <button class="message-pill" data-key="porque" style="--c:#ffe7a7;--x:-350px;--y:137px;--mx:-120px;--my:150px;--r:4deg;--delay:.23s">¿Por qué tú?<small>cinco respuestas y más</small></button>
      <button class="message-pill" data-key="triste" style="--c:#e2d4ff;--x:355px;--y:135px;--mx:110px;--my:145px;--r:-4deg;--delay:.32s">Si estás triste<small>modo descanso</small></button>
      <button class="message-pill" data-key="futuro" style="--c:#fffaf0;--x:0px;--y:270px;--mx:0px;--my:240px;--r:1deg;--delay:.41s">Tu carrera<small>para descubrir tu camino</small></button>
    </nav>
  </main>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="letterTitle"><article class="letter"><button class="close" aria-label="Cerrar carta">×</button><div id="letterContent"></div></article></div>
  <aside class="player" id="player"><button class="play" id="play" aria-label="Reproducir música">▶</button><div class="visualizer"><i></i><i></i><i></i></div><div class="song"><b>Melancolía</b>desde 1:23</div><audio id="audio" preload="metadata" src="Mon-Laferte-Melancol-a-(CeeNaija.com).mp3"></audio></aside>
  <script>
    const letters={
      relacion:{title:'Nuestra relación',body:`<p>Una gran relación funciona no solo con amor; también funciona al trabajar día a día y elegirnos cada día, sin importar qué.</p><p>No me importa cuánto estrés tenga o si estoy pasando por un mal día: siempre tendré un abrazo para ti, mi amor.</p>`},
      enojo:{title:'Enojo e ira',body:`<p>Es normal sentir eso. Tal vez te sientes frustrada por el futuro, porque las cosas no salen como quieres o incluso por nuestra relación.</p><p>Tómate un respiro, mi amor. Toma agua o simplemente escucha música. Recuerda que no siempre tienes que cargar con todo.</p><p>Tómate un descanso y deja que esas emociones fluyan; guardarlas puede lastimarte y hacerte sentir peor.</p><button class="breath">Tomar un respiro</button><div class="breath-orb" aria-label="Animación para respirar"></div>`},
      porque:{title:'¿Por qué tú?',body:`<p>Sencillamente, porque eres todo:</p><div class="qualities"><span style="--i:1">Interesante</span><span style="--i:2">Bonita</span><span style="--i:3">Amable</span><span style="--i:4">Sencilla</span><span style="--i:5">Loquita</span><span style="--i:6">Cariñosa</span><span style="--i:7">Comprensiva</span><span style="--i:8">Inteligente</span><span style="--i:9">Esforzada</span></div><p>Muchísimas cosas te caracterizan como una gran novia. Eres todo en mi vida y puedes lograr todo si te lo propones.</p><p>Amarte implica tiempo y responsabilidad, pero no solo eso: significa entregarte todo el amor que tengo día a día. A veces podrá ser mucho y otras veces poco; aun así, seguiré entregándote todo el amor que haya en mis manos, solo para ti.</p>`},
      triste:{title:'Si estás triste',body:`<p>Tómate un descanso. Eres capaz de muchas cosas, pero en este momento necesitas relajarte. No necesitas cargar con todo.</p><p>Date tiempo para ti misma y simplemente haz algo que te guste, sencillo pero efectivo, como escuchar música.</p><p class="quote">No todos los problemas tienen soluciones difíciles; a veces, hasta el problema más imposible tiene soluciones fáciles.</p>`},
      futuro:{title:'Tu carrera',body:`<p class="quote">“Estudia lo que más te interese de la forma más indisciplinada y original posible.” — Richard Feynman</p><p>Con esto no me refiero a que seas floja. Quiero que sepas que puedes darte permiso a ti misma: olvida por un momento el futuro, lo que yo quiera, lo que tu madre quiera o lo que quiera alguien más.</p><p>Date permiso de explorar y sigue aquello que despierte tu curiosidad. Aunque sea raro, tú hazlo. Salta de un tema a otro, combina lo que te apasione sin pedir permiso; simplemente hazlo.</p><p>Tu camino no es una línea recta. Estás en la edad perfecta para experimentar y descubrir qué es lo que más te apasiona.</p>`}
    };
    const body=document.body,jar=document.querySelector('#jar'),magic=document.querySelector('.magic');
    for(let i=0;i<24;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';document.querySelector('.sky').append(s)}
    ['✦','♡','✧','♥','✦','☁','✧','♡'].forEach((v,i)=>{const s=document.createElement('i');s.className='spark';s.textContent=v;s.style.cssText=`--x:${Math.cos(i*.8)*190}px;--y:${Math.sin(i*.8)*170-80}px;--d:${i*.05}s`;magic.append(s)});
    jar.addEventListener('click',()=>{body.classList.add('open');jar.setAttribute('aria-expanded','true')});
    const modal=document.querySelector('#modal'),content=document.querySelector('#letterContent');
    document.querySelectorAll('.message-pill').forEach(b=>b.addEventListener('click',()=>{const l=letters[b.dataset.key];content.innerHTML=`<h2 id="letterTitle">${l.title}</h2>${l.body}`;modal.classList.add('visible');document.querySelector('.close').focus();const breath=content.querySelector('.breath');if(breath)breath.onclick=()=>{const orb=content.querySelector('.breath-orb');orb.classList.remove('go');void orb.offsetWidth;orb.classList.add('go');breath.textContent='Inhala… exhala…'}}));
    function close(){modal.classList.remove('visible')}document.querySelector('.close').onclick=close;modal.addEventListener('click',e=>{if(e.target===modal)close()});addEventListener('keydown',e=>{if(e.key==='Escape')close()});
    const audio=document.querySelector('#audio'),play=document.querySelector('#play'),player=document.querySelector('#player');audio.addEventListener('loadedmetadata',()=>{audio.currentTime=Math.min(83,audio.duration||83)},{once:true});play.onclick=async()=>{if(audio.paused){if(audio.currentTime<82)audio.currentTime=83;await audio.play();play.textContent='Ⅱ';player.classList.add('playing')}else{audio.pause();play.textContent='▶';player.classList.remove('playing')}};audio.onended=()=>{play.textContent='▶';player.classList.remove('playing')};
    let last=0;addEventListener('pointermove',e=>{if(Date.now()-last<70)return;last=Date.now();const s=document.createElement('span');s.className='trail';s.textContent='✦';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';body.append(s);setTimeout(()=>s.remove(),760)});
  </script>
</body>
</html>
